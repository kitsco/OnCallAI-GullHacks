# Front door on port 80 (the only port the hackathon Wi-Fi reliably allows).
#   /charges, /health      -> payments-api copies (the payment system)
#   everything else (/)    -> Streamlit dashboard running on the server host, port 8501
#
# The re-resolve trick: Docker's DNS (127.0.0.11) returns one address per payments-api copy.
# Using a variable in proxy_pass makes nginx look the name up again every 5 seconds,
# so after "docker compose up -d --scale payments-api=4" the new copies get traffic too.
resolver 127.0.0.11 valid=5s ipv6=off;

# Streamlit talks to the browser over a WebSocket; these headers let nginx pass it through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location = /nginx-health {
        return 200 "ok\n";
    }

    # ---- the payment API ----
    location /charges {
        set $payments_upstream http://payments-api:8000;
        proxy_pass $payments_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location = /health {
        set $payments_upstream http://payments-api:8000;
        proxy_pass $payments_upstream;
    }

    # ---- the dashboard (Streamlit on the host; see extra_hosts in docker-compose.yml) ----
    location / {
        proxy_pass http://host.docker.internal:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
